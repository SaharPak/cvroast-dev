<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمکمون کن بهترین ابزار رزومه رو بسازیم</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #111110;
    --surface: #1a1918;
    --surface-2: #222120;
    --surface-3: #2c2a28;
    --border: #332f2c;
    --border-soft: #2a2725;
    --text: #f0ece8;
    --text-2: #c4beb6;
    --text-muted: #8a8279;
    --text-dim: #5c5650;
    --flame: #ff6b35;
    --ember: #ff9f1c;
    --flame-glow: rgba(255, 107, 53, 0.12);
    --ember-glow: rgba(255, 159, 28, 0.10);
    --ok: #6ee7b7;
    --ok-bg: rgba(110, 231, 183, 0.08);
    --warn: #fcd34d;
    --bad: #fca5a5;
    --bad-bg: rgba(252, 165, 165, 0.07);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
  }

  h1, h2, h3 { font-family: 'Vazirmatn', 'Space Grotesk', sans-serif; }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .hero {
    text-align: center;
    margin-bottom: 40px;
  }

  .hero-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ember);
    background: var(--ember-glow);
    border: 1px solid rgba(255, 159, 28, 0.2);
    padding: 5px 16px;
    border-radius: 100px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 20px;
    direction: ltr;
  }

  .hero h1 {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin-bottom: 14px;
  }

  .hero h1 .gradient {
    background: linear-gradient(135deg, var(--flame) 0%, var(--ember) 50%, #ffcd69 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    font-size: 15px;
    color: var(--text-2);
    line-height: 1.8;
    max-width: 540px;
    margin: 0 auto;
  }

  .tally-embed {
    margin-top: 8px;
    border-radius: 20px;
    overflow: hidden;
  }

  .footer {
    text-align: center;
    padding: 32px 0 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .footer a { color: var(--text-muted); text-decoration: none; }
  .footer a:hover { color: var(--ember); }

  @media (max-width: 600px) {
    .hero h1 { font-size: 26px; }
    .container { padding: 24px 16px 40px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="hero">
    <div class="hero-badge">Resume Tool Feedback</div>
    <h1>کمکمون کن بهترین <span class="gradient">ابزار رزومه</span> رو بسازیم</h1>
    <p>۳۶ نفر از بچه‌های کامیونیتی Tech Immigrants داوطلب شدن که یه پروژه اپن‌سورس برای ساخت رزومه درست کنن. خوشحال میشیم اگه چالش‌هاتو با ما share کنی که یه ابزار حرفه‌ای بسازیم.</p>
  </div>

  <div class="tally-embed">
    <iframe data-tally-src="https://tally.so/embed/yPoDWX?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
      loading="lazy" width="100%" height="500" frameborder="0" marginheight="0" marginwidth="0"
      title="Feedback Form"></iframe>
  </div>

  <div class="footer">
    ساخته شده توسط <a href="https://t.me/twitterimmigrant">Tech Immigrants</a> · <a href="https://cvroast.dev">cvroast.dev</a>
  </div>

</div>

<script src="https://tally.so/widgets/embed.js"></script>

</body>
</html>
